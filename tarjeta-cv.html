<!DOCTYPE html>

<head>

  <meta property="og:image" content="https://eurekawebsites.github.io/tarjeta-aster/images/brand/og-share-1200x630.jpg">

  <meta name="twitter:description" content="Asesor de Viajes · Viajes personalizados a cualquier rincón del mundo">
  <meta name="twitter:image" content="https://eurekawebsites.github.io/tarjeta-aster/images/brand/og-share-1200x630.jpg">
  <link rel="stylesheet" href="css/brand-tokens.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { overflow-x: hidden; }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    html, body {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        url("images/coordenada-card/page-background-light-desktop.webp")
        center center / cover fixed no-repeat;
      padding: 24px 12px;
    }

    @media (max-width: 700px) {
      body {
        background-image:
          url("images/coordenada-card/page-background-light-mobile.webp");
        background-attachment: scroll;
      }
    }

    /* ===== Card =====
       The entire visible card — background, border, notches, stamps,
       compass, all typography, contact rows, save plaque, and the
       Eureka footer — is one locked production image. Nothing here
       draws, positions, or types any visible element; the overlays
       below are purely invisible click targets. */

    .cv-card {
      position: relative;
      width: min(calc(100vw - 24px), 430px);
      aspect-ratio: 984 / 1599;
      margin-inline: auto;
    }

    .cv-card-art {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
    }

    /* transparent interactive overlays only */
    .hotspot {
      position: absolute;
      display: block;
      background: transparent;
      border: 0;
      padding: 0;
      cursor: pointer;
    }

    /* only show an accessibility focus ring for keyboard users */
    .hotspot:focus-visible {
      outline: 2px solid #b98a34;
      outline-offset: 2px;
    }

    /* Brief copy confirmation. Sits below the card, never over the
       artwork, so it doesn't violate "no visible HTML text over image". */
    .copy-toast {
      margin-top: 10px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #2D5016;
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
    }
    .copy-toast.show { opacity: 1; }
  </style>
</head>
<body>

  <div class="cv-card" aria-label="Tarjeta digital de Aster Íñigo Volta — Coordenada Viajes">
    <img
      class="cv-card-art"
      src="images/coordenada-card/aster-coordenada-approved-exact-430.webp"
      srcset="images/coordenada-card/aster-coordenada-approved-exact-430.webp 430w, images/coordenada-card/aster-coordenada-approved-exact.webp 984w"
      sizes="(max-width: 430px) 100vw, 430px"
      alt=""
      draggable="false"
    >

    <!-- transparent interactive overlays only; positions measured from the locked 984x1599 reference -->

    <a class="hotspot" href="https://wa.me/19295226443" target="_blank" rel="noopener noreferrer"
       style="left:15.2439%; top:54.9093%; width:66.7683%; height:6.1914%;"
       aria-label="WhatsApp +1 (929) 522-6443"></a>

    <a class="hotspot" href="https://www.instagram.com/coordenada.viajes/" target="_blank" rel="noopener noreferrer"
       style="left:15.2439%; top:61.7261%; width:66.7683%; height:6.1914%;"
       aria-label="Instagram @coordenada.viajes"></a>

    <a class="hotspot" href="https://coordenadaviajes.com" target="_blank" rel="noopener noreferrer"
       style="left:15.2439%; top:68.5428%; width:66.7683%; height:6.1914%;"
       aria-label="Sitio web coordenadaviajes.com"></a>

    <button type="button" class="hotspot" onclick="copyClabeCV(this)"
       style="left:15.2439%; top:75.3596%; width:66.7683%; height:6.1914%;"
       aria-label="Copiar CLABE interbancaria BBVA 012180015593495708">
      <span class="sr-only" id="clabe-cv">012180015593495708</span>
    </button>

    <button type="button" class="hotspot" onclick="saveContactCV()"
       style="left:13.7195%; top:82.9894%; width:70.3252%; height:5.6911%;"
       aria-label="Guardar contacto"></button>

    <a class="hotspot" href="https://www.eurekawebsites.tech/" target="_blank" rel="noopener noreferrer"
       style="left:24.5935%; top:90.7442%; width:50.8130%; height:4.2527%;"
       aria-label="Eureka Tech"></a>

  </div>

  <p class="copy-toast" id="copy-toast" role="status" aria-live="polite">¡CLABE copiada!</p>

  <script>
    function copyClabeCV(btn) {
      navigator.clipboard.writeText('012180015593495708').then(function() {
        showCopyToast();
      }).catch(function() {
        var range = document.createRange();
        range.selectNode(btn.querySelector('#clabe-cv'));
        window.getSelection().removeAllRanges();
        window.getSelection().addRange(range);
        showCopyToast();
      });
    }

    function showCopyToast() {
      var toast = document.getElementById('copy-toast');
      toast.classList.add('show');
      clearTimeout(showCopyToast._t);
      showCopyToast._t = setTimeout(function() {
        toast.classList.remove('show');
      }, 2000);
    }

    function saveContactCV() {
      var vcard = [
        'BEGIN:VCARD',
        'VERSION:3.0',
        'FN:Aster Íñigo Volta',
        'N:Íñigo Volta;Aster;;;',
        'ORG:Coordenada Viajes',
        'TITLE:Asesor de Viajes',
        'TEL;TYPE=CELL,VOICE:+19295226443',
        'URL:https://coordenadaviajes.com',
        'X-SOCIALPROFILE;type=instagram:https://www.instagram.com/coordenada.viajes/',
        'NOTE:CLABE BBVA: 012180015593495708',
        'END:VCARD'
      ].join('\r\n');
      var blob = new Blob([vcard], { type: 'text/vcard' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'Aster-Inigo-Coordenada.vcf';
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>

</body>
</html>
