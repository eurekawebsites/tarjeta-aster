    .bracket {
      position: absolute;
      width: 16px;
      height: 16px;
      border-color: #C9A84C;
      border-style: solid;
      opacity: 0.5;

    .bracket--tl { top: 10px; left: 10px; border-width: 2px 0 0 2px; }
    .bracket--tr { top: 10px; right: 10px; border-width: 2px 2px 0 0; }
    .bracket--bl { bottom: 10px; left: 10px; border-width: 0 0 2px 2px; }
    .bracket--br { bottom: 10px; right: 10px; border-width: 0 2px 2px 0; }

    .card-cv .strip {
      padding: 11px 20px;
      text-align: center;
      background: rgba(201,168,76,0.1);
      border-top: 1px solid rgba(201,168,76,0.18);
      border-bottom: 1px solid rgba(201,168,76,0.18);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.65rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #C9A84C;
      font-weight: 700;

    .card-cv .contact {

      gap: 9px;

    .card-cv .btn {

      color: #F5F0E8;
      cursor: pointer;
      width: 100%;
      text-align: left;
    }

    .card-cv .btn:hover { opacity: 0.75; transform: translateY(-1px); }

    .card-cv .btn-label {

  <script>
    function copyClabeCV(btn) {
      navigator.clipboard.writeText('012180015593495708').then(function() {
        var el = btn.querySelector('#clabe-cv');
        var orig = el.textContent;
        el.textContent = '¡Copiado!';
        setTimeout(function() { el.textContent = orig; }, 2000);
      }).catch(function() {
        var range = document.createRange();
        range.selectNode(btn.querySelector('#clabe-cv'));
        window.getSelection().removeAllRanges();
        window.getSelection().addRange(range);
      });
    }

    function saveContactCV() {
      var vcard = [

        'N:Íñigo Volta;Aster;;;',

        'X-SOCIALPROFILE;type=instagram:https://www.instagram.com/coordenada.viajes/',
        'NOTE:CLABE BBVA: 012180015593495708',
        'END:VCARD'
      ].join('\r\n');
      var blob = new Blob([vcard], { type: 'text/vcard' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'Aster-Inigo-Coordenada.vcf';
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
