<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="A simple no-CRM method to track leads, send better messages, and stop losing potential clients. By Aster Volta.">

  <link rel="canonical" href="https://tarjeta-aster.web.app/book/">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://tarjeta-aster.web.app/book/">
  <meta property="og:title" content="The 15 Minute Follow Up System">
  <meta property="og:description" content="A simple no-CRM method to track leads, send better messages, and stop losing potential clients. By Aster Volta.">
  <meta property="og:image" content="https://m.media-amazon.com/images/I/717nFUJilgL._SL1500_.jpg">
  <meta property="og:image:secure_url" content="https://m.media-amazon.com/images/I/717nFUJilgL._SL1500_.jpg">
  <meta property="og:image:alt" content="Cover of The 15 Minute Follow Up System by Aster Volta">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="The 15 Minute Follow Up System">
  <meta name="twitter:description" content="A simple no-CRM method to track leads, send better messages, and stop losing potential clients. By Aster Volta.">
  <meta name="twitter:image" content="https://m.media-amazon.com/images/I/717nFUJilgL._SL1500_.jpg">

  <style>
    :root {
      color-scheme: dark;
      --bg: #07111e;
      --panel: #0c1b2c;
      --text: #f7fbff;
      --muted: #b8c8d8;
      --accent: #50d7e8;
      --accent2: #55f0c8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 85% 15%, rgba(80,215,232,.16), transparent 28rem),
        radial-gradient(circle at 15% 85%, rgba(85,240,200,.10), transparent 26rem),
        var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 28px;
    }
    .card {
      width: min(980px, 100%);
      display: grid;
      grid-template-columns: minmax(220px, 330px) 1fr;
      gap: clamp(28px, 5vw, 58px);
      align-items: center;
      background: linear-gradient(145deg, rgba(16,35,57,.96), rgba(7,17,30,.98));
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 28px;
      padding: clamp(24px, 5vw, 56px);
      box-shadow: 0 24px 80px rgba(0,0,0,.36);
    }
    .cover {
      width: 100%;
      display: block;
      border-radius: 6px;
      box-shadow: 0 18px 50px rgba(0,0,0,.45);
    }
    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      font-size: .78rem;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 4.6vw, 4.2rem);
      line-height: .98;
      letter-spacing: -.045em;
    }
    .subtitle {
      margin: 22px 0 0;
      color: var(--muted);
      font-size: clamp(1.02rem, 2vw, 1.24rem);
      line-height: 1.55;
    }
    .author {
      margin: 18px 0 0;
      font-weight: 700;
      color: #dff8ff;
    }
    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 30px;
      padding: 15px 22px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      color: #031019;
      text-decoration: none;
      font-weight: 900;
      letter-spacing: .01em;
    }
    .note {
      margin: 14px 0 0;
      font-size: .85rem;
      color: #8297aa;
    }
    @media (max-width: 720px) {
      .card { grid-template-columns: 1fr; text-align: center; }
      .cover { width: min(250px, 72vw); margin-inline: auto; }
      .cta { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div>
      <img class="cover" src="https://m.media-amazon.com/images/I/717nFUJilgL._SL1500_.jpg" alt="The 15 Minute Follow Up System book cover">
    </div>
    <section>
      <p class="eyebrow">Kindle eBook</p>
      <h1>The 15 Minute Follow Up System</h1>
      <p class="subtitle">A simple no-CRM method to track leads, send better messages, and stop losing potential clients.</p>
      <p class="author">By Aster Volta</p>
      <a class="cta" href="https://www.amazon.com/dp/B0HKHPGY6J">View on Amazon</a>
      <p class="note">Includes a practical lead tracker, a 15-minute daily routine, and 30 ready-to-personalize follow-up messages.</p>
    </section>
  </main>
</body>
</html>
