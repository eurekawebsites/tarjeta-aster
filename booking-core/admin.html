<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eureka Booking · Admin Demo</title><style>:root{--bg:#f4f5f1;--ink:#172019;--muted:#6c756e;--line:#dce2dc;--accent:#17501e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,-apple-system,Segoe UI,sans-serif}.wrap{width:min(1050px,calc(100% - 28px));margin:auto;padding:28px 0 60px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}h1{font-size:32px;margin:0;letter-spacing:-.04em}.muted{color:var(--muted)}a,button{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 12px;border-radius:10px;text-decoration:none;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px}.stat strong{font-size:26px;display:block}.list{display:grid;gap:10px}.card{display:grid;grid-template-columns:1.2fr .9fr .8fr auto;gap:14px;align-items:center}.card strong,.card span{display:block}.card small{color:var(--muted)}.pill{display:inline-block!important;padding:4px 7px;border-radius:999px;background:#edf5ee;color:var(--accent);font-size:11px}.empty{text-align:center;padding:50px;background:#fff;border:1px dashed var(--line);border-radius:15px}.danger{color:#8d2935}.tenantnav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}.tenantnav a{font-size:11px}@media(max-width:720px){.stats{grid-template-columns:1fr}.card{grid-template-columns:1fr}.actions{display:flex;gap:8px;flex-wrap:wrap}header{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><header><div><div class="muted">Eureka Booking</div><h1>Solicitudes · Admin demo</h1><div id="business" class="muted"></div></div><div><a id="bookingLink" href="./">Abrir reservas</a> <button id="clear" class="danger">Vaciar demo</button></div></header><nav class="tenantnav"><a href="?business=clinica-demo-roma">Clínica</a><a href="?business=dental-demo">Dental</a><a href="?business=spa-demo">Spa</a></nav><div class="stats"><div class="stat"><strong id="total">0</strong><span class="muted">Solicitudes</span></div><div class="stat"><strong id="today">0</strong><span class="muted">Para hoy</span></div><div class="stat"><strong id="pending">0</strong><span class="muted">Pendientes</span></div></div><section id="list" class="list"></section></main><script type="module">import{BUSINESS}from'./config.js';import{createBookingStorage}from'./storage.js';const storage=createBookingStorage(BUSINESS),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));document.documentElement.style.setProperty('--accent',BUSINESS.accent);document.querySelector('#business').textContent=BUSINESS.name;document.querySelector('#bookingLink').href='./?business='+encodeURIComponent(BUSINESS.id);async function render(){const rows=await storage.listRequests(),today=new Date().toISOString().slice(0,10);document.querySelector('#total').textContent=rows.length;document.querySelector('#today').textContent=rows.filter(x=>x.date===today).length;document.querySelector('#pending').textContent=rows.filter(x=>x.status==='requested').length;document.querySelector('#list').innerHTML=rows.length?rows.map(x=>`<article class="card"><div><strong>${esc(x.customer.name)}</strong><small>${esc(x.customer.phone)} ${x.customer.email?'· '+esc(x.customer.email):''}</small></div><div><strong>${esc(x.service.name)}</strong><small>${esc(x.location.name)} · ${esc(x.provider.name)}</small></div><div><strong>${esc(x.date)} · ${esc(x.time)}</strong><small>${esc(x.id)}</small></div><div class="actions"><span class="pill">Pendiente</span></div></article>`).join(''):'<div class="empty"><strong>Aún no hay solicitudes en este navegador para este negocio.</strong><p class="muted">Crea una desde la demo de reservas y aparecerá aquí. Cada negocio demo usa almacenamiento separado.</p></div>'}document.querySelector('#clear').onclick=async()=>{if(confirm('¿Vaciar las solicitudes locales de esta demo?')){await storage.clearRequests();render()}};render();</script></body></html>
